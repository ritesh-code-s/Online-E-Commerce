<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - ShopSphere</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
</head>

<body>

    <header>

        <h1>ShopSphere</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>

    <main>

        <section class="product-details">

            <h2>Product Details</h2>

            <div class="product-details-card">

                <div class="product-image">

                    <img src="images/default.jpg" alt="Demo Product">

                </div>

                <div class="product-information">

                    <h3>Demo Product</h3>

                    <p>
                        This is a demo product.
                    </p>

                    <p class="price">
                        ₹999.99
                    </p>

                    <p>
                        Category: General
                    </p>

                    <p>
                        Available Stock: 10
                    </p>

                    <form action="cart" method="post">

                        <input type="hidden" name="userId" value="1">

                        <input type="hidden" name="productId" value="1">

                        <label for="quantity">
                            Quantity:
                        </label>

                        <input type="number" id="quantity" name="quantity" value="1" min="1" max="10" required>

                        <button type="submit">
                            Add to Cart
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 ShopSphere. All rights reserved.
        </p>

    </footer>

</body>

</html>
