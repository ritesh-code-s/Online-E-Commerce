<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - ShopSphere</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <header>

        <h1>ShopSphere Admin</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="add-product.html">Add Product</a>
            <a href="orders.html">Orders</a>
            <a href="../index.html">Store</a>
            <a href="../logout">Logout</a>
        </nav>

    </header>

    <main>

        <section class="admin-form">

            <h2>Add New Product</h2>

            <form action="../admin" method="post">

                <input type="hidden" name="action" value="addProduct">

                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="Enter product name" required>

                </div>

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description" name="description" placeholder="Enter product description" rows="5"
                        required></textarea>

                </div>

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input type="number" id="price" name="price" placeholder="Enter product price" min="0" step="0.01"
                        required>

                </div>

                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input type="number" id="stock" name="stock" placeholder="Enter stock quantity" min="0" required>

                </div>

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input type="text" id="category" name="category" placeholder="Enter product category" required>

                </div>

                <div class="form-group">

                    <label for="image">
                        Image File Name
                    </label>

                    <input type="text" id="image" name="image" placeholder="Example: laptop.jpg">

                </div>

                <button type="submit">
                    Add Product
                </button>

                <a href="products.html">
                    <button type="button">
                        Cancel
                    </button>
                </a>

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 ShopSphere. All rights reserved.
        </p>

    </footer>

</body>

</html>
