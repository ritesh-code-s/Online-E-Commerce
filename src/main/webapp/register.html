<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ShopSphere</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <header>
        <h1>ShopSphere</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main>
        <section class="auth-container">

            <h2>Create Account</h2>

            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name"
                        maxlength="100" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        maxlength="150" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Create a password"
                        autocomplete="new-password" minlength="8" maxlength="128" required>
                </div>

                <!-- Register Button -->
                <button type="submit" id="registerButton">
                    Register
                </button>

                <!-- Server Message -->
                <p id="registerMessage" role="status" aria-live="polite">
                </p>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 ShopSphere. All rights reserved.</p>
    </footer>


    <script>

        /* =====================================================
           REGISTER FORM
        ===================================================== */

        const registerForm =
            document.getElementById("registerForm");

        const registerButton =
            document.getElementById("registerButton");

        const registerMessage =
            document.getElementById("registerMessage");


        /* =====================================================
           SHOW MESSAGE
        ===================================================== */

        function showMessage(message) {
            registerMessage.textContent = message;
        }


        /* =====================================================
           REGISTER
        ===================================================== */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                showMessage("");

                registerButton.disabled = true;
                registerButton.textContent =
                    "Creating account...";


                try {

                    /*
                     * IMPORTANT:
                     * RegisterServlet is mapped to:
                     *
                     * @WebServlet("/register")
                     *
                     * Therefore we send the request to:
                     *
                     * register
                     */


                    const response = await fetch(
                        `${window.location.origin}/ShopSphere/register`,
                        {
                            method: "POST",
                            body: new FormData(registerForm)
                        }
                    );



                    /*
                     * Read the server response.
                     */

                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";


                    let result;


                    if (
                        contentType.includes(
                            "application/json"
                        )
                    ) {

                        result =
                            await response.json();

                    } else {

                        /*
                         * If Tomcat sends a normal
                         * error page instead of JSON,
                         * read it as text.
                         */

                        const text =
                            await response.text();

                        result = {
                            message:
                                text ||
                                "Server returned an unexpected response."
                        };
                    }


                    /*
                     * SUCCESS
                     */

                    if (response.ok) {

                        showMessage(
                            result.message ||
                            "Registration successful!"
                        );

                        registerForm.reset();

                    }


                    /*
                     * SERVER / VALIDATION ERROR
                     */

                    else {

                        showMessage(
                            result.message ||
                            "Registration failed. Please try again."
                        );
                    }

                }


                /*
                 * NETWORK ERROR
                 */

                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server. " +
                        "Please make sure Tomcat is running."
                    );

                }


                finally {

                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Register";
                }

            }
        );

    </script>

</body>

</html>
